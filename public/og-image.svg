<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Decorative Subtle Grid & Accents -->
  <circle cx="150" cy="100" r="300" fill="#10b981" opacity="0.05" />
  <circle cx="1050" cy="530" r="350" fill="#3b82f6" opacity="0.04" />

  <!-- Container Box -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Logo Group Left -->
  <g transform="translate(140, 155)" filter="url(#shadow)">
    <!-- Outer Map Pin (Dark Slate / Glowing Border) -->
    <path fill="#ffffff" d="M 120 10 C 64 10 18 56 18 112 C 18 158 72 210 120 242 C 168 210 222 158 222 112 C 222 56 176 10 120 10 Z" />
    
    <!-- Dark Inner Cutout -->
    <path fill="#0f172a" d="M 120 32 C 80 32 48 64 48 104 C 48 114 50 124 54 132 L 186 132 C 190 124 192 114 192 104 C 192 64 160 32 120 32 Z" />
    
    <!-- Chimney -->
    <rect x="145" y="62" width="11" height="21" fill="#ffffff" />

    <!-- Main Outer Gable Roof -->
    <path fill="#ffffff" d="M 120 56 L 63 100 L 75 109 L 120 74 L 165 109 L 177 100 Z" />

    <!-- Secondary Inner Gable Roof -->
    <path fill="#10b981" d="M 120 82 L 80 113 L 90 120 L 120 97 L 150 120 L 160 113 Z" />
  </g>

  <!-- Text Group Right -->
  <g transform="translate(410, 200)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="140" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#34d399" text-anchor="middle" letter-spacing="1">VERIFIED STUDENT HOUSING</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="'Montserrat', system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="#ffffff" letter-spacing="4">CAMPORA</text>

    <!-- Description Paragraph -->
    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
      <tspan x="0" dy="0">Discover, compare, and book verified hostels and</tspan>
      <tspan x="0" dy="32">apartments near your campus gate with ease.</tspan>
    </text>

    <!-- Pill Tag Features -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="160" height="36" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="80" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0" text-anchor="middle">✓ Physical Audit</text>

      <rect x="175" y="0" width="170" height="36" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="260" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0" text-anchor="middle">⚡ Solar &amp; Utilities</text>

      <rect x="360" y="0" width="180" height="36" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="450" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0" text-anchor="middle">🔒 Zero Scam Guarantee</text>
    </g>
  </g>
</svg>
